<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tentakel-Toast</title>
<meta name="description" content="Tentakel-Toast: ein inoffizielles Day-of-the-Tentacle-Fanspiel. Point & Click durch drei Zeitalter, mit Chrono-Klo, Gut-O-Mat und Lila Tentakel. Spielbar mit Maus, Touch und Xbox-Controller.">
<meta property="og:title" content="Tentakel-Toast">
<meta property="og:description" content="Ein inoffizielles Day-of-the-Tentacle-Fanspiel im Browser. Drei Helden, drei Zeiten, ein Toast.">

<meta name="theme-color" content="#120a1c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M16 60 C12 40 16 16 30 7 C42 1 50 10 47 24 C45 38 46 50 56 58 Z' fill='%238e44c9' stroke='%231b1020' stroke-width='4'/%3E%3Cellipse cx='47' cy='20' rx='8' ry='6' fill='%235b2589' stroke='%231b1020' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Pixelify+Sans:wght@500;700&family=Titan+One&display=swap">
<style>
  :root { --bg: #120a1c; --ink: #f3eaff; --muted: #b9a8dc; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    font-family: "Baloo 2", system-ui, sans-serif;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  canvas { display: block; touch-action: none; cursor: none; outline: none; -webkit-tap-highlight-color: transparent; position: relative; z-index: 1; }
  /* Umgebungslicht hinter dem Spielbild: winziges Abbild der Szene, vom Browser weich hochskaliert */
  #amb { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s; }
  #drehen { position: relative; z-index: 1; }
  @media (hover: none) { canvas { cursor: default; } }
  #drehen { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    #drehen {
      display: flex; gap: 12px; align-items: center; justify-content: center;
      margin-top: 18px; padding: 10px 16px; max-width: calc(100% - 32px);
      border: 2px solid #5a4290; border-radius: 12px; background: #1f1432;
      color: var(--muted); font-size: 15px; font-weight: 700; text-align: left;
    }
    #drehen svg { flex: none; }
  }
  noscript { padding: 16px; max-width: 40rem; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="amb" width="40" height="25" aria-hidden="true"></canvas>
<canvas id="game" width="960" height="600" aria-label="Spielfläche: Tentakel-Toast, ein Point-and-Click-Abenteuer"></canvas>
<div id="drehen" role="note">
  <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="9" y="3" width="16" height="28" rx="3" fill="none" stroke="#ffd23a" stroke-width="2.5"/><path d="M4 22 A13 13 0 0 1 8 8" fill="none" stroke="#b9a8dc" stroke-width="2.5"/><path d="M4 8 L8 8 L8 12" fill="none" stroke="#b9a8dc" stroke-width="2.5"/></svg>
  <span>Dreh dein Gerät ins Querformat. Tippen = Aktion, lange drücken = Standard-Aktion.</span>
</div>
<noscript>Tentakel-Toast braucht JavaScript. Bitte aktiviere es, um zu spielen.</noscript>
<script src="js/draw.js"></script>
<script src="js/pixel.js"></script>
<script src="js/audio.js"></script>
<script src="js/lang.js"></script>
<script src="js/rooms.js"></script>
<script src="js/engine.js"></script>
<script src="js/story.js"></script>
</body>
</html>
